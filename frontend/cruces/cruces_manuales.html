<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Administración manual de cruces</title>
  <link rel="stylesheet" href="./cruces_manuales.css?v=puntos-legibles-1" />
</head>
<body>
  <header class="site-header">
    <a href="../index.html" title="Inicio" class="logo-link">
      <img src="../logo_liga.png" alt="LPI" />
    </a>
    <div class="header-center"><h1>ADMINISTRACIÓN DE CRUCES</h1></div>
    <div class="header-actions">
      <a id="btnVolverAdmin" class="btn" href="../admin.html" aria-label="Volver a administración">VOLVER</a>
    </div>
  </header>

  <main class="page">
    <section class="topbar" aria-labelledby="searchTitle">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">CRUCES DEL FIXTURE</p>
          <h2 id="searchTitle">CARGAR O CORREGIR RESULTADOS</h2>
        </div>
        <span id="modeBadge" class="mode-badge new">NUEVO</span>
      </div>

      <div class="controls">
        <label>Categoría
          <select id="categoria">
            <option value="segunda">Segunda</option>
            <option value="tercera" selected>Tercera</option>
            <option value="primera">Primera</option>
          </select>
        </label>
        <label>Edición
          <select id="edicion">
            <option value="6" selected>6TA EDICIÓN</option>
            <option value="5">5TA EDICIÓN</option>
          </select>
        </label>
        <label>Fecha del fixture
          <select id="fechaISO"></select>
        </label>
        <label>Partido
          <select id="fixtureMatch"></select>
        </label>
      </div>

      <div class="actions">
        <button id="btnCargar" class="secondary" type="button">CARGAR CRUCE</button>
        <button id="btnGuardar" type="button" disabled>GUARDAR CRUCE</button>
      </div>

      <div id="status" class="hint">
        Elegí categoría, edición, fecha y partido. Las fechas disponibles salen únicamente del fixture.
      </div>
    </section>

    <section id="editorSummary" class="editor-summary" hidden>
      <div><span class="summary-label">LOCAL</span><strong id="localTeamName"></strong></div>
      <span class="versus">VS</span>
      <div><span class="summary-label">VISITANTE</span><strong id="visitanteTeamName"></strong></div>
    </section>

    <input id="localTeam" type="hidden" />
    <input id="visitanteTeam" type="hidden" />

    <section class="layout" aria-live="polite">
      <div id="localRoot"></div>
      <div id="visitanteRoot"></div>
    </section>
  </main>

  <template id="cardTpl">
    <div class="card">
      <div class="team-role"></div>
      <h2 class="team-title"></h2>
      <div class="sections"></div>
      <div class="totals total-wrap">
        <div class="chip total-chip">
          <span class="label">TRIÁNGULOS TOTALES</span>
          <div class="totalbox totalValue">0</div>
        </div>
      </div>
      <div class="totals wins-wrap">
        <div class="chip wins-chip">
          <span class="label">PUNTOS</span>
          <div class="winsbox winsValue">0</div>
        </div>
      </div>
    </div>
  </template>

  <script src="../config.js?v=renewable-session-1"></script>
  <script src="../match-format.js"></script>
  <script src="./cruces_manuales.js?v=20260904-reprogramado-1"></script>
</body>
</html>
